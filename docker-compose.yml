version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # 1. Apache Kafka (KRaft Mode — Partitioned Ingestion Queue)
  # ---------------------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.7
    container_name: pulselog-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_NUM_PARTITIONS=4
      - KAFKA_CFG_LOG_RETENTION_HOURS=24
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. ClickHouse Columnar Database (Optimized for Write-Heavy Log Workloads)
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: pulselog-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. PulseLog Central Ingestion Pipeline & React Analytics Dashboard
  # ---------------------------------------------------------------------------
  ingestor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulselog-ingestor
    command: ["/app/ingestor", "--addr=:8080", "--dashboard=/app/dashboard", "--auto-simulate=true"]
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - CLICKHOUSE_HTTP_URL=http://clickhouse:8123
      - ALERT_EMAIL_TO=sre-oncall@pulselog.io
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 4. PulseLog Lightweight Server Log Agent (Streaming Micro-Batches)
  # ---------------------------------------------------------------------------
  log-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulselog-agent
    command:
      - "/app/log-agent"
      - "--endpoint=http://ingestor:8080/api/v1/ingest"
      - "--agent-id=prod-edge-agent-01"
      - "--host=prod-k8s-worker-01"
      - "--simulate=true"
      - "--rate=30"
      - "--batch-size=50"
      - "--linger-ms=200"
    depends_on:
      - ingestor

volumes:
  clickhouse_data:

